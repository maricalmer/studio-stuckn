[build]
  # Keep Netlify aligned with the repository's npm-only package-manager policy.
  # File-based settings override the site's older `yarn build` UI setting.
  command = "npm run build"
  publish = ".next"
  # The Sanity Studio is a separate application deployed through Sanity.
  # Skip this frontend build when a commit changes only files under `studio/`.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)studio/**'"

[build.environment]
  # `.nvmrc` selects Node 24.18.0; pin npm independently because Netlify's
  # bundled npm version can change when its build image changes.
  NPM_VERSION = "11.16.0"

[[plugins]]
  # Exact version is pinned in package.json/package-lock.json for the migration
  # checkpoint. Verify this version in the deploy log before promotion.
  package = "@netlify/plugin-nextjs"
